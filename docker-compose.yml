services:
  librarian:
    image: ghcr.io/yellowmachine/librarian-bun-kilo:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:3000'
    environment:
      NODE_ENV: production
      ORIGIN: ${ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Orígenes de confianza (Scholio + Librarian) y cookie compartida entre subdominios
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      # Database (externa, compartida con Scholio vía scholio-network — mismo rol/DB, schema "librarian")
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      # Auth providers
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Encryption — debe ser EXACTAMENTE el mismo valor que en Scholio
      KMS_MASTER_KEY: ${KMS_MASTER_KEY}
      # Redirect a Scholio cuando el usuario no tiene acceso / hace logout
      SCHOLIO_REDIRECT: ${SCHOLIO_REDIRECT:-https://scholio.review}
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN:-}
    networks:
      - scholio-network
      - dokploy-network

networks:
  scholio-network:
    external: true
  dokploy-network:
    external: true
