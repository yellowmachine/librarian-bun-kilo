# La app en Docker contra el Postgres de compose.yaml (puerto 5436 del host).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://app_user:app_user@host.docker.internal:5436/librarian}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://librarian:librarian@host.docker.internal:5436/librarian}
      ORIGIN: ${ORIGIN:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev_secret_librarian_dev_secret_librarian}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
